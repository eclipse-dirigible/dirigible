name: Pull Request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK Corretto 24
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '24'
          architecture: x64

      - name: Validate Java code formatting
        run: mvn -T 1C formatter:validate

  # npm refuses a large package (E413), and only the release publishes it: #7708 grew the CLI jar
  # the package then bundled to 352 MB and the 14.77.0 release was the first to notice (#7771).
  # The packages download their jars at install, so anything near the limit is a regression.
  npm-package-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Check the npm package sizes
        run: |
          limit=1048576
          for package in npm/dirigible npm/dirigible-cli; do
            size=$(cd "$package" && npm pack --dry-run --json --ignore-scripts | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].unpackedSize))')
            echo "$package: $size bytes unpacked"
            if [ "$size" -gt "$limit" ]; then
              echo "::error title=npm package too large::$package unpacks to $size bytes, above $limit - a jar must be downloaded at install, not bundled (#7771)"
              exit 1
            fi
          done

  # The release build runs the default profile's attach-javadocs execution, which fails on any Javadoc
  # error (a bare "&" in a comment stopped the 14.77.0 release, run 37765397470). Every other build
  # skips Javadoc, so the release was the first to see it. This runs the same execution without the
  # tests: about two minutes.
  javadoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set up JDK Corretto 24
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '24'
          architecture: x64

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install TypeScript and esbuild
        run: npm install -g typescript@5.9.3 esbuild

      - name: Javadoc check (as in the release build)
        run: mvn -T 1C clean install -P default,quick-build -Dmaven.javadoc.skip=false

  tests:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [ ubuntu, windows ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set up JDK Corretto 24
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '24'
          architecture: x64

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install TypeScript and esbuild
        run: npm install -g typescript@5.9.3 esbuild

      - name: Maven Build
        run: mvn clean install -P unit-tests -U

      - name: Container Tests
        if: runner.os == 'Linux'
        run: mvn test -P testcontainers

      # The committed intent samples are what the intent generates on this very build (#7642): the
      # platform jar the build just produced runs `generate --check` over them (#7793). Last, because the action sets up
      # its own JDK.
      - name: Regeneration check of the intent samples
        if: runner.os == 'Linux'
        uses: ./.github/actions/regen-check
        with:
          dirigible-jar: build/application/target/dirigible-application-*-executable.jar
          projects: tests/tests-integrations/src/main/resources/sample-intent-*

  docker-build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: amd64
          - runner: ubuntu-24.04-arm
            platform: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK Corretto 24
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '24'

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install TypeScript and esbuild
        run: npm install -g typescript@5.9.3 esbuild

      - name: Maven Build
        run: mvn clean install -P quick-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: build/application
          platforms: ${{ matrix.platform }}
          push: false

  smoke-tests:
    runs-on: ubuntu-latest
    # ~91 min green (measured on runs 34489811133 / 34490597976 / 34491967246): the gate selects
    # every HTTP-level IT plus the smoke-tagged journeys, and each IT class boots its own Spring
    # context. The cap only has to be out of a healthy run's way - it exists so a hang costs one
    # job instead of the 6h GitHub default (#7283).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set up JDK Corretto 24
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '24'
          architecture: x64

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install TypeScript and esbuild
        run: npm install -g typescript@5.9.3 esbuild

      - name: Install ttyd (prebuilt)
        run: |
          sudo apt update
          sudo apt install -y ttyd

      - name: Verify ttyd installation
        run: ttyd --version

      # Fast per-PR gate on H2: the HTTP-level ITs plus the few smoke-tagged UI journeys
      # (including two full clone -> generate -> validate app lifecycles). The heavy Selenide
      # suite (@Tag "ui") runs nightly and on master push - see nightly.yml and build.yml.
      - name: Smoke integration tests (H2)
        run: mvn clean install -P integration-tests -Dit.groups="(!ui | smoke) & !upgrade & !perf"

      # Guards #7215: a tag expression that discovers nothing leaves the reports directory absent
      # and the build green, so what ran is asserted by count instead of by the job's colour.
      # Failsafe's own failIfNoTests cannot cover this - scanning does find the IT classes, the tag
      # filter drops them afterwards - and every shard expression selects a non-empty set.
      # A cancelled or failed run must leave evidence behind (#7283): the job-level timeout kills
      # the Maven step before the guard below ever runs, so without an always() upload the reports
      # of every class that DID finish - and any thread dump TestStallWatchdog wrote for the one
      # that did not - are thrown away with the runner.
      - name: Upload integration test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: failsafe-reports-smoke-${{ github.run_attempt }}
          path: |
            tests/tests-integrations/target/failsafe-reports
            tests/tests-integrations/target/surefire-reports
          if-no-files-found: ignore

      - name: Assert integration tests ran
        run: |
          ran=$(ls tests/tests-integrations/target/failsafe-reports/TEST-*.xml 2>/dev/null | wc -l)
          if [ "$ran" -eq 0 ]; then
            echo "::error::No integration test was executed - the ITs stopped being discovered (see #7215)"
            exit 1
          fi
          echo "$ran integration test classes ran"

      - name: Generate a random artifact name
        if: always()
        id: generate_name
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          echo "ARTIFACT_NAME=selenide-screenshots-${TIMESTAMP}.zip" >> $GITHUB_ENV

      - name: Upload selenide screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: ${{ env.ARTIFACT_NAME }}
          path: tests/tests-integrations/build/reports/tests

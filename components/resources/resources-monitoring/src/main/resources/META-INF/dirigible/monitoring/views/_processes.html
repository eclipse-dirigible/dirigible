  Processes - the triage page. Running (or completed) instances on the left; the selected instance's
  live diagram, variables, tasks and incidents on the right. The only management actions are Retry
  and Skip on a stuck step; starting instances and editing variables stay in the Workbench.
-->
<div id="monitoring-processes-page" class="vbox size-full" x-data="processesPage">

  <div x-h-toolbar data-variant="transparent">
    <span x-h-toolbar-title class="shrink-0" x-text="T('monitoring:processes.title', 'Processes')"></span>
    <button x-h-button data-size="sm" :data-variant="state.mode === 'active' ? 'primary' : 'transparent'"
            @click="state.setMode('active')" x-text="T('monitoring:processes.active', 'Running')"></button>
    <button x-h-button data-size="sm" :data-variant="state.mode === 'historic' ? 'primary' : 'transparent'"
            @click="state.setMode('historic')" x-text="T('monitoring:processes.historic', 'Completed')"></button>
    <div x-h-toolbar-spacer></div>
    <div class="w-3xs shrink-0">
      <input x-h-input type="search" x-model="state.filter"
             :placeholder="T('monitoring:processes.search', 'Search process, business key or id')" />
    </div>
    <button x-h-button data-variant="outline" data-size="sm" @click="state.load()" :disabled="state.loading">
      <template x-if="state.loading"><span x-h-spinner class="size-4"></span></template>
      <svg role="presentation" x-h-lucide data-lucide="refresh-cw" x-show="!state.loading"></svg>
      <span x-text="T('monitoring:overview.refresh', 'Refresh')"></span>
    </button>
  </div>

  <div x-h-split class="flex-1 min-h-0" data-orientation="horizontal" data-variant="border">

    <!-- Instances -->
    <div x-h-split-panel data-size="40%">
      <div class="vbox size-full overflow-auto">
        <div x-show="state.loading" x-cloak class="vbox gap-2 p-3">
          <template x-for="i in 5" :key="i"><div x-h-skeleton class="h-6 w-full"></div></template>
        </div>
        <div x-show="!state.loading && state.error" x-cloak x-h-text.muted class="p-3 text-sm"
             x-text="T('monitoring:processes.loadFailed', 'The process engine could not be reached.')"></div>
        <div x-show="!state.loading && !state.error && state.visibleInstances.length === 0" x-cloak
             x-h-text.muted class="p-3 text-sm"
             x-text="T('monitoring:processes.empty', 'No process instances.')"></div>

        <table x-h-table x-show="!state.loading && state.visibleInstances.length" x-cloak>
          <thead x-h-table-header>
            <tr x-h-table-row>
              <th x-h-table-head scope="col" x-text="T('monitoring:processes.colProcess', 'Process')"></th>
              <th x-h-table-head scope="col" x-text="T('monitoring:overview.colBusinessKey', 'Business key')"></th>
              <th x-h-table-head scope="col" x-text="T('monitoring:processes.colStarted', 'Started')"></th>
            </tr>
          </thead>
          <tbody x-h-table-body>
            <template x-for="instance in state.visibleInstances" :key="instance.id">
              <tr x-h-table-row data-hoverable="true" class="cursor-pointer"
                  :data-state="state.selectedId === instance.id ? 'selected' : ''" @click="state.select(instance)">
                <td x-h-table-cell x-text="titleOf(instance)"></td>
                <td x-h-table-cell x-text="instance.businessKey || ''"></td>
                <td x-h-table-cell x-text="startedText(instance)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Detail: collapsed until an instance is selected. -->
    <div x-h-split-panel data-size="60%" :data-hidden="!state.selected">
      <template x-if="state.selected">
        <div class="vbox size-full min-h-0">

          <div x-h-toolbar data-size="sm">
            <span x-h-toolbar-title class="shrink-0" x-text="titleOf(state.selected)"></span>
            <span x-show="state.selected.businessKey" x-h-badge data-variant="outline"
                  x-text="state.selected.businessKey"></span>
            <div x-h-toolbar-spacer></div>
            <button x-h-button data-variant="transparent" data-size="icon-sm" @click="state.clearSelection()"
                    aria-label="Close" :title="T('monitoring:processes.close', 'Close')">
              <svg role="presentation" x-h-lucide data-lucide="x"></svg>
            </button>
          </div>

          <!-- The incident is why this page exists, so it sits above the tabs, with its two actions. -->
          <div x-show="state.incidents.length" x-cloak class="vbox gap-2 p-3">
            <div class="hbox items-center gap-2">
              <span x-h-badge data-variant="negative"
                    x-text="T('monitoring:processes.stuck', 'Stuck: {{count}} dead-letter job(s)', { count: state.incidents.length })"></span>
              <div class="flex-1"></div>
              <button x-h-button data-variant="outline" data-size="sm" :disabled="state.acting"
                      @click="state.act('RETRY')">
                <template x-if="state.acting"><span x-h-spinner class="size-4"></span></template>
                <svg role="presentation" x-h-lucide data-lucide="rotate-cw" x-show="!state.acting"></svg>
                <span x-text="T('monitoring:processes.retry', 'Retry')"></span>
              </button>
              <button x-h-button data-variant="outline" data-size="sm" :disabled="state.acting"
                      @click="state.act('SKIP')">
                <svg role="presentation" x-h-lucide data-lucide="skip-forward"></svg>
                <span x-text="T('monitoring:processes.skip', 'Skip step')"></span>
              </button>
            </div>
            <template x-for="incident in state.incidents" :key="incident.id">
              <p class="text-xs text-muted-foreground" :title="incident.exceptionMessage"
                 x-text="shorten(incident.exceptionMessage)"></p>
            </template>
          </div>

          <div x-show="state.actionResult" x-cloak class="px-3 pb-2">
            <span x-h-badge :data-variant="state.actionResult ? state.actionResult.variant : 'outline'"
                  x-text="state.actionResult ? state.actionResult.text : ''"></span>
          </div>

          <!-- Every tab lives in its own x-h-tab-item; each tab names the panel it controls and the
               panel names the tab that labels it (the Harmonia tabs contract). -->
          <div x-h-tabs data-orientation="horizontal" class="flex-1 min-h-0">
            <div x-h-tab-bar data-size="sm">
              <div x-h-tab-list>
                <div x-h-tab-item>
                  <button id="monitoring-process-tab-diagram" x-h-tab aria-controls="monitoring-process-panel-diagram"
                          :aria-selected="tab === 'diagram'" @click="selectTab('diagram')"
                          x-text="T('monitoring:processes.tabDiagram', 'Diagram')"></button>
                </div>
                <div x-h-tab-item>
                  <button id="monitoring-process-tab-variables" x-h-tab aria-controls="monitoring-process-panel-variables"
                          :aria-selected="tab === 'variables'" @click="selectTab('variables')"
                          x-text="T('monitoring:processes.tabVariables', 'Variables')"></button>
                </div>
                <div x-h-tab-item x-show="state.mode === 'active'">
                  <button id="monitoring-process-tab-tasks" x-h-tab aria-controls="monitoring-process-panel-tasks"
                          :aria-selected="tab === 'tasks'" @click="selectTab('tasks')"
                          x-text="T('monitoring:processes.tabTasks', 'Tasks')"></button>
                </div>
              </div>
              <!-- The zoom controls act on the diagram, so they show with its tab only. -->
              <div x-h-tab-list-actions.end x-show="tab === 'diagram'">
                <button x-h-tab-list-action data-variant="transparent" @click="zoomOut()" aria-label="Zoom out">
                  <svg role="presentation" x-h-lucide data-lucide="zoom-out"></svg>
                </button>
                <button x-h-tab-list-action data-variant="transparent" @click="zoomIn()" aria-label="Zoom in">
                  <svg role="presentation" x-h-lucide data-lucide="zoom-in"></svg>
                </button>
                <button x-h-tab-list-action data-variant="transparent" @click="fit()" aria-label="Fit">
                  <svg role="presentation" x-h-lucide data-lucide="maximize"></svg>
                </button>
              </div>
            </div>

            <!-- The diagram is rendered into its container by the page component; the container only
                 exists while its tab is open, because the visualizer measures it on load. -->
            <div id="monitoring-process-panel-diagram" x-h-tabs-content aria-labelledby="monitoring-process-tab-diagram"
                 :hidden="tab !== 'diagram'" tabindex="-1" class="flex-1 min-h-0">
              <template x-if="tab === 'diagram'">
                <div class="size-full">
                  <div x-show="diagramError" x-cloak x-h-text.muted class="p-3 text-sm" x-text="diagramError"></div>
                  <div x-ref="diagram" class="monitoring-bpmn size-full"></div>
                </div>
              </template>
            </div>

            <!-- Variables (read-only - editing them is Workbench territory) -->
            <div id="monitoring-process-panel-variables" x-h-tabs-content aria-labelledby="monitoring-process-tab-variables"
                 :hidden="tab !== 'variables'" tabindex="-1" class="flex-1 min-h-0 overflow-auto p-3">
              <div x-show="!state.variables.length" x-h-text.muted class="text-sm"
                   x-text="T('monitoring:processes.noVariables', 'This instance carries no variables.')"></div>
              <div x-h-table-container x-show="state.variables.length">
                <table x-h-table>
                  <thead x-h-table-header>
                    <tr x-h-table-row>
                      <th x-h-table-head scope="col" x-text="T('monitoring:processes.colName', 'Name')"></th>
                      <th x-h-table-head scope="col" x-text="T('monitoring:processes.colType', 'Type')"></th>
                      <th x-h-table-head scope="col" x-text="T('monitoring:processes.colValue', 'Value')"></th>
                    </tr>
                  </thead>
                  <tbody x-h-table-body>
                    <template x-for="variable in state.variables" :key="variable.id || variable.name">
                      <tr x-h-table-row>
                        <td x-h-table-cell x-text="variable.name"></td>
                        <td x-h-table-cell x-text="typeOf(variable)"></td>
                        <td x-h-table-cell x-text="valueText(variable.value)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Open user tasks -->
            <div id="monitoring-process-panel-tasks" x-h-tabs-content aria-labelledby="monitoring-process-tab-tasks"
                 :hidden="tab !== 'tasks'" tabindex="-1" class="flex-1 min-h-0 overflow-auto p-3">
              <div x-show="!state.tasks.length" x-h-text.muted class="text-sm"
                   x-text="T('monitoring:processes.noTasks', 'No open user tasks.')"></div>
              <div x-h-table-container x-show="state.tasks.length">
                <table x-h-table>
                  <thead x-h-table-header>
                    <tr x-h-table-row>
                      <th x-h-table-head scope="col" x-text="T('monitoring:processes.colTask', 'Task')"></th>
                      <th x-h-table-head scope="col" x-text="T('monitoring:processes.colAssignee', 'Assignee')"></th>
                      <th x-h-table-head scope="col" x-text="T('monitoring:processes.colCandidates', 'Candidates')"></th>
                    </tr>
                  </thead>
                  <tbody x-h-table-body>
                    <template x-for="task in state.tasks" :key="task.id">
                      <tr x-h-table-row>
                        <td x-h-table-cell x-text="task.name"></td>
                        <td x-h-table-cell x-text="task.assignee || ''"></td>
                        <td x-h-table-cell x-text="[task.candidateUsers, task.candidateGroups].filter(Boolean).join(', ')"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </template>
    </div>

  </div>
</div>

<!-- Document capture (#8544) - ONE standalone page for every `captures:` entry of every application,
     served at /services/web/application-core/shell/views/capture.html and opened by the two buttons the
     intent generator contributes (the entity list's capture action and the record's review action) in
     the app-wide dialog of the hosting shell. It is parameterized by its query string, so a capture
     ships no page of its own:

       capture  absolute path of the generated <Name>Capture controller (POST /upload, GET /review/{id})
       entity   the captured entity's name, for the titles
       files    optional: absolute path of the attachment child's controller, where the kept file is read
       fk       optional: the attachment's foreign-key property to the record (with `files`)
       mode     `review` opens on the record named by `id` instead of the upload step
       id       the record to review

     `capture` and `files` are validated as same-origin /services/java/ paths before anything is sent, so
     the page cannot be used to POST a user's file anywhere else.

     It follows the precedent of the other standalone pages (the task form and the report page): the
     shell assets are loaded by absolute URL, the colour scheme is applied by Harmonia itself, and a
     failed call reaches the screen only through the shared App.services.apiErrors gate - never through
     an exception's message. It ends by posting `harmonia.form.close` to its host (customActions store).

     Deliberate deviations from the Harmonia components, per the skill:
       - The two panes are a plain responsive grid, not x-h-split: the layout is fixed (document on the
         left, flags on the right, stacked on a narrow dialog) and nothing is meant to be resized.
       - The camera is a second, hidden native input (`capture="environment"`) behind a "Take a photo"
         button, whose file is handed to the x-h-file-upload input. One input with `capture` would make a
         phone open the camera ONLY, with no way to pick a PDF or a saved scan; the second input leaves
         the first one a normal picker. On a desktop the button is not shown (no coarse pointer). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capture</title>
    <link href="/webjars/codbex__harmonia/dist/harmonia.css" rel="stylesheet" />
    <style>
      /* Harmonia styles `body`, not `html`; theme both so the dialog's iframe surface follows the scheme
         harmonia.min.js applies (and keeps in sync with the hosting shell). Tokens only, no literals. */
      html, body { height: 100%; background-color: var(--background); color: var(--foreground); }
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="vbox" x-data="capturePage" x-cloak>

    <main class="flex-1 min-h-0 overflow-auto p-4" id="capture-main">

      <!-- A link the page will not act on: neutral, says nothing about why. -->
      <template x-if="step === 'invalid'">
        <div x-h-info-page id="capture-invalid">
          <div x-h-info-page-header>
            <div x-h-info-page-media.icon>
              <svg x-h-lucide role="presentation" data-lucide="circle-x"></svg>
            </div>
            <div x-h-info-page-title x-text="t('invalidTitle', 'This page cannot be opened')"></div>
            <div x-h-info-page-description x-text="t('invalidText', 'The link to document capture is not valid.')"></div>
          </div>
        </div>
      </template>

      <!-- Step 1: choose the document and capture it. -->
      <section x-show="step === 'upload'" class="vbox gap-4 mx-auto w-full max-w-3xl" id="capture-upload">
        <div class="vbox gap-1">
          <h2 x-h-text.h4 x-text="t('uploadTitle', 'Create a draft {{entity}} from a document', { entity: entityName })"></h2>
          <p x-h-text.muted x-text="t('intro', 'The document is sent to the configured reading service, which fills in a draft for you to review. Nothing is approved until you do.')"></p>
        </div>

        <template x-if="notice">
          <div x-h-alert :data-variant="notice.variant" role="alert" id="capture-notice">
            <svg x-h-lucide role="presentation" data-lucide="circle-alert"></svg>
            <div x-h-alert-title x-text="notice.title"></div>
            <div x-h-alert-description x-show="notice.text" x-text="notice.text"></div>
          </div>
        </template>

        <!-- A capture that read the document but could not create the record (a REJECTED refusal) says what
             it read and what is missing: no record exists, so there is no review pane and no image. -->
        <template x-if="rejectedFlags.length">
          <div class="vbox gap-2" id="capture-rejected">
            <h3 x-h-text.h5 x-text="t('rejectedFlagsTitle', 'What was read needs your attention')"></h3>
            <ul x-h-list id="capture-rejected-flags" :aria-label="t('rejectedFlagsTitle', 'What was read needs your attention')">
                  <template x-for="(flag, index) in rejectedFlags" :key="index">
                    <li x-h-list-item data-capture-flag :data-flag-field="flag.field" :data-flag-reason="flag.reason">
                      <div class="vbox min-w-0 flex-1 gap-1 p-2">
                        <div class="hbox flex-wrap items-center gap-2">
                          <span class="font-medium wrap-anywhere" data-flag-label x-text="fieldLabel(flag.field)"></span>
                          <span x-h-badge :data-variant="reasonVariant(flag.reason)" x-text="reasonLabel(flag.reason)"></span>
                        </div>
                        <span x-h-list-secondary class="text-sm wrap-anywhere" x-show="flag.value !== null && flag.value !== undefined && flag.value !== ''"
                              x-text="t('flagValue', 'Read as: {{value}}', { value: flag.value })"></span>
                        <span x-h-list-secondary class="text-sm wrap-anywhere" data-flag-message x-show="flagNote(flag)" x-text="flagNote(flag)"></span>
                      </div>
                    </li>
                  </template>
                </ul>
          </div>
        </template>

        <div x-h-field>
          <label x-h-label for="capture-file" x-text="t('fileLabel', 'Document')"></label>
          <div x-h-input-group x-h-file-upload :data-placeholder="t('noFile', 'No file chosen')">
            <input type="file" id="capture-file" name="file" x-ref="picker" accept="image/jpeg,image/png,image/gif,image/webp,application/pdf"
                   :disabled="busy" @change="picked($event)" />
            <div x-h-input-group-addon data-align="inline-start">
              <div x-h-tag-group></div>
            </div>
            <div x-h-input-group-addon data-align="inline-end">
              <button type="button" x-h-button.addon :disabled="busy" x-text="t('choose', 'Choose a file')"></button>
            </div>
          </div>
          <p x-h-field-description id="capture-hint" x-text="t('hint', 'JPEG, PNG, GIF, WebP or PDF, up to 10 MB.')"></p>
        </div>

        <!-- The camera: a phone offers it, a desktop has the picker above. -->
        <div class="hbox items-center gap-2" x-show="camera">
          <button type="button" x-h-button data-variant="outline" id="capture-camera" :disabled="busy" @click="$refs.camera.click()">
            <svg x-h-lucide role="presentation" data-lucide="camera"></svg>
            <span x-text="t('takePhoto', 'Take a photo')"></span>
          </button>
          <input type="file" class="sr-only" tabindex="-1" x-ref="camera" accept="image/*" capture="environment"
                 :aria-label="t('takePhoto', 'Take a photo')" @change="cameraPicked($event)" />
        </div>

        <p class="text-sm wrap-anywhere" id="capture-chosen" x-show="chosen"
           x-text="chosen ? t('chosen', '{{name}} ({{size}})', { name: chosen.name, size: sizeText(chosen.size) }) : ''"></p>
      </section>

      <!-- Step 2: the document beside what to review. -->
      <section x-show="step === 'review'" class="vbox gap-4" id="capture-review">
        <div class="vbox gap-1">
          <h2 x-h-text.h4 x-text="t('reviewTitle', 'Review the draft {{entity}}', { entity: entityName })"></h2>
          <p class="text-sm wrap-anywhere hbox flex-wrap items-center gap-x-3 gap-y-1" id="capture-meta" x-show="review && review.captureName">
            <span class="font-medium" id="capture-file-name" x-text="review ? review.fileName : ''"></span>
            <span x-h-text.muted x-show="whenText" x-text="whenText ? t('capturedOn', 'Captured {{when}}', { when: whenText }) : ''"></span>
            <span x-h-text.muted x-show="review && review.capturedBy" x-text="review && review.capturedBy ? t('capturedBy', 'by {{who}}', { who: review.capturedBy }) : ''"></span>
            <span x-h-text.muted x-show="review && review.model" x-text="review && review.model ? t('readBy', 'Read by {{model}}', { model: review.model }) : ''"></span>
          </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">

          <!-- LEFT: the kept file. -->
          <div x-h-card class="min-w-0" id="capture-document">
            <div x-h-card-header>
              <div x-h-card-title x-text="t('documentTitle', 'Document')"></div>
            </div>
            <div x-h-card-content>
              <template x-if="fileState === 'loading'">
                <div class="hbox items-center gap-2" x-h-text.muted>
                  <span x-h-spinner></span>
                  <span x-text="t('loading', 'Loading...')"></span>
                </div>
              </template>
              <template x-if="fileState === 'ready' && kept.kind === 'image'">
                <img id="capture-image" data-capture-file :src="kept.url" :alt="t('documentAlt', 'the captured document')"
                     class="w-full object-contain" style="max-height: 70vh" @error="fileState = 'error'" />
              </template>
              <template x-if="fileState === 'ready' && kept.kind === 'pdf'">
                <iframe id="capture-pdf" data-capture-file :src="kept.url" :title="t('documentFrame', 'The captured document')"
                        class="w-full" style="height: 60vh; border: 0"></iframe>
              </template>
              <template x-if="fileState === 'none' || fileState === 'empty'">
                <div x-h-info-page id="capture-no-file">
                  <div x-h-info-page-header>
                    <div x-h-info-page-media.icon>
                      <svg x-h-lucide role="presentation" data-lucide="file-x"></svg>
                    </div>
                    <div x-h-info-page-title x-text="t('noFileTitle', 'No document file')"></div>
                    <div x-h-info-page-description x-text="t('noFileText', 'No file is kept with this record.')"></div>
                  </div>
                </div>
              </template>
              <template x-if="fileState === 'error'">
                <div x-h-info-page id="capture-file-error">
                  <div x-h-info-page-header>
                    <div x-h-info-page-media.icon>
                      <svg x-h-lucide role="presentation" data-lucide="file-x"></svg>
                    </div>
                    <div x-h-info-page-title x-text="t('fileUnavailable', 'The file could not be shown.')"></div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- RIGHT: what to look at. -->
          <div x-h-card class="min-w-0" id="capture-flags-card">
            <div x-h-card-header>
              <div x-h-card-title id="capture-flag-count" x-text="reviewState === 'ready' ? flagCountText : t('reviewPane', 'To review')"></div>
            </div>
            <div x-h-card-content>
              <template x-if="reviewState === 'loading'">
                <div class="hbox items-center gap-2" x-h-text.muted>
                  <span x-h-spinner></span>
                  <span x-text="t('loading', 'Loading...')"></span>
                </div>
              </template>
              <template x-if="reviewState === 'error'">
                <div x-h-alert data-variant="negative" role="alert" id="capture-review-error">
                  <svg x-h-lucide role="presentation" data-lucide="circle-x"></svg>
                  <div x-h-alert-title x-text="reviewError"></div>
                </div>
              </template>
              <template x-if="reviewState === 'none'">
                <div x-h-info-page id="capture-not-captured">
                  <div x-h-info-page-header>
                    <div x-h-info-page-media.icon>
                      <svg x-h-lucide role="presentation" data-lucide="scan-line"></svg>
                    </div>
                    <div x-h-info-page-title x-text="t('notFromScan', 'This record was not created from a scan.')"></div>
                  </div>
                </div>
              </template>
              <template x-if="reviewState === 'ready' && flags.length === 0">
                <div x-h-info-page id="capture-nothing-flagged">
                  <div x-h-info-page-header>
                    <div x-h-info-page-media.icon>
                      <svg x-h-lucide role="presentation" data-lucide="circle-check"></svg>
                    </div>
                    <div x-h-info-page-title x-text="t('nothingFlaggedTitle', 'Nothing to review')"></div>
                    <div x-h-info-page-description x-text="t('nothingFlagged', 'Nothing was flagged. Still check the draft before approving it.')"></div>
                  </div>
                </div>
              </template>
              <template x-if="reviewState === 'ready' && flags.length > 0">
                <ul x-h-list id="capture-flags" :aria-label="flagCountText">
                  <template x-for="(flag, index) in flags" :key="index">
                    <li x-h-list-item data-capture-flag :data-flag-field="flag.field" :data-flag-reason="flag.reason">
                      <div class="vbox min-w-0 flex-1 gap-1 p-2">
                        <div class="hbox flex-wrap items-center gap-2">
                          <span class="font-medium wrap-anywhere" data-flag-label x-text="fieldLabel(flag.field)"></span>
                          <span x-h-badge :data-variant="reasonVariant(flag.reason)" x-text="reasonLabel(flag.reason)"></span>
                        </div>
                        <span x-h-list-secondary class="text-sm wrap-anywhere" x-show="flag.value !== null && flag.value !== undefined && flag.value !== ''"
                              x-text="t('flagValue', 'Read as: {{value}}', { value: flag.value })"></span>
                        <span x-h-list-secondary class="text-sm wrap-anywhere" data-flag-message x-show="flagNote(flag)" x-text="flagNote(flag)"></span>
                      </div>
                    </li>
                  </template>
                </ul>
              </template>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- The busy / result state, announced politely. -->
    <div class="px-4 pb-2" role="status" aria-live="polite" id="capture-status">
      <div class="hbox items-center gap-2" :class="busy ? '' : 'sr-only'" x-h-text.muted x-show="liveText">
        <span x-h-spinner x-show="busy"></span>
        <span x-text="liveText"></span>
      </div>
    </div>

    <footer class="hbox justify-end gap-2 p-4 border-t border-border" id="capture-footer">
      <template x-if="step !== 'review'">
        <button type="button" x-h-button data-variant="outline" id="capture-cancel" :disabled="busy" @click="cancel()"
                x-text="t('cancel', 'Cancel')"></button>
      </template>
      <template x-if="step === 'upload'">
        <button type="button" x-h-button data-variant="primary" id="capture-submit" :disabled="!chosen || busy" @click="capture()">
          <span x-h-spinner x-show="busy"></span>
          <span x-text="t('capture', 'Capture')"></span>
        </button>
      </template>
      <template x-if="step === 'review'">
        <button type="button" x-h-button data-variant="primary" id="capture-done" @click="done()" x-text="t('done', 'Done')"></button>
      </template>
    </footer>

    <script src="/services/web/application-core/shell/js/services/apiError.js"></script>
    <script src="/services/web/application-core/shell/js/services/api.js"></script>
    <!-- i18n: this page names no project, so the shell's own catalog ('application-core') is the only
         namespace it needs and the one i18n.js always loads. A page that DID render module-authored
         labels would set App.config.projectName here first, as the task form and the report page do. -->
    <script>window.App = window.App || { config: {} }; App.config = App.config || {};</script>
    <!-- The language the instance offers (#8632): the labels and Accept-Language follow it, never a saved one it does not. -->
    <script src="/services/web/application-core/shell/js/stores/locale.js"></script>
    <script src="/services/web/application-core/shell/js/services/i18n.js"></script>
    <script>
      document.addEventListener('alpine:init', () => {
        const MAX_BYTES = 10 * 1024 * 1024;
        const TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf'];
        const EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'pdf'];
        const KEY = 'application-core:shell.capture.';
        // The only locations a capture or its files may live at - generated controllers of this
        // instance. Anything else (another origin, another service, a traversal, an encoded slash) is
        // refused before a byte is sent.
        const SAFE_PATH = /^\/services\/java\/[A-Za-z0-9_\-./]+$/;
        const safePath = (value) => typeof value === 'string' && SAFE_PATH.test(value) && value.indexOf('..') < 0 && value.indexOf('//') < 0;
        const SAFE_NAME = /^[A-Za-z_][A-Za-z0-9_]*$/;
        const SAFE_ID = /^[A-Za-z0-9_.\-]{1,64}$/;
        const enc = encodeURIComponent;

        Alpine.data('capturePage', () => ({
          step: 'upload',            // invalid | upload | review
          reviewMode: false,         // opened on an existing record: nothing changes, so no toast
          captureBase: '',
          filesBase: '',
          fk: '',
          entityName: 'record',
          camera: false,
          chosen: null,              // the File picked for upload
          busy: false,
          notice: null,              // { variant, title, text } on the upload step
          rejectedFlags: [],         // what a REJECTED capture read and could not complete
          recordId: null,
          uploaded: false,           // a capture ran in this page: Done reports it
          review: null,              // the capture's ledger entry (or the upload's own answer)
          reviewState: 'loading',    // loading | ready | none | error
          reviewError: '',
          fileState: 'loading',      // loading | ready | none | empty | error
          kept: null,                // { id, name, kind, url }

          t(key, fallback, options) { return window.T(KEY + key, fallback, options); },

          init() {
            const params = new URLSearchParams(window.location.search);
            const capture = params.get('capture');
            const files = params.get('files');
            const fk = params.get('fk');
            const id = params.get('id');
            this.reviewMode = params.get('mode') === 'review';
            const entity = (params.get('entity') || '').trim();
            if (entity) this.entityName = entity.substring(0, 100);
            if (!safePath(capture) || (files !== null && !safePath(files)) || (fk !== null && !SAFE_NAME.test(fk))
                || (this.reviewMode && !SAFE_ID.test(id || ''))) {
              this.step = 'invalid';
              return;
            }
            this.captureBase = capture;
            if (files && fk) { this.filesBase = files; this.fk = fk; }
            try { this.camera = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); } catch (e) { this.camera = false; }
            if (this.reviewMode) {
              this.step = 'review';
              this.recordId = id;
              // The file is picked by the capture's file name, so the ledger entry is read first.
              this.loadReview(id, false).then(() => this.loadFiles(id));
            }
          },

          // ----- the upload step -----

          picked(event) { this.setFile(event.target.files && event.target.files[0], event.target); },

          // The camera's photo goes to the file input, so there is one source of truth (and one tag).
          cameraPicked(event) {
            const photo = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!photo) return;
            const picker = this.$refs.picker;
            try {
              const transfer = new DataTransfer();
              transfer.items.add(photo);
              picker.files = transfer.files;
              picker.dispatchEvent(new Event('change', { bubbles: true }));
            } catch (e) {
              this.setFile(photo, null);
            }
          },

          setFile(file, input) {
            this.notice = null;
            this.rejectedFlags = [];
            this.chosen = null;
            if (!file) return;
            const extension = (file.name.split('.').pop() || '').toLowerCase();
            let problem = null;
            if (TYPES.indexOf(file.type) < 0 && !(file.type === '' && EXTENSIONS.indexOf(extension) >= 0)) {
              problem = this.t('wrongType', 'Only images (JPEG, PNG, GIF, WebP) and PDF files can be captured.');
            } else if (file.size > MAX_BYTES) {
              problem = this.t('tooLarge', 'The file is larger than 10 MB. Choose a smaller file or a lower-resolution photo.');
            } else if (file.size === 0) {
              problem = this.t('empty', 'The file is empty.');
            }
            if (problem) {
              if (input) input.value = '';
              this.notice = { variant: 'warning', title: problem, text: '' };
              return;
            }
            this.chosen = file;
          },

          sizeText(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
          },

          async capture() {
            if (!this.chosen || this.busy) return;
            this.busy = true;
            this.notice = null;
            this.rejectedFlags = [];
            try {
              let response;
              let body = null;
              let confirmed = [];
              for (;;) {
                const form = new FormData();
                form.append('file', this.chosen, this.chosen.name);
                const headers = { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' };
                if (confirmed.length) headers['X-Confirm-Warnings'] = confirmed.join(',');
                try {
                  response = await fetch(this.captureBase + '/upload', { method: 'POST', body: form, credentials: 'same-origin', headers });
                } catch (e) {
                  this.notice = this.failure({ httpStatus: 0, errorType: 'NetworkError' }, null);
                  return;
                }
                body = null;
                try { body = await response.json(); } catch (e) { body = null; }
                // What the record's soft checks warn about - the same document captured twice (#8631) -
                // is asked as a save asks it (the shared dialog), and the upload repeated naming the codes
                // confirmed; a warning that appears only on the repeat is asked again.
                if (response.status !== 428 || !body || !Array.isArray(body.warnings) || !body.warnings.length) break;
                this.busy = false; // not reading while the person answers
                const yes = await App.services.confirmWarnings(body.warnings);
                this.busy = true;
                if (!yes) {
                  this.notice = { variant: 'warning', title: this.t('notConfirmed', 'Not captured - the warnings were not confirmed.'), text: '' };
                  return;
                }
                confirmed = body.warnings.map((w) => w.code);
              }
              if (response.ok && body && body.status === 'CAPTURED' && body.recordId !== null && body.recordId !== undefined) {
                this.accept(body);
                return;
              }
              if (body && body.status === 'REJECTED' && Array.isArray(body.flags)) this.rejectedFlags = body.flags;
              this.notice = this.failure({
                httpStatus: response.status,
                errorType: (body && body.errorType) || App.services.api.typeFromStatus(response.status),
                errorMessage: body && (body.errorMessage || body.message || body.error),
              }, body);
            } finally {
              this.busy = false;
            }
          },

          // The alert for a capture that did not create a record. The lead-in is ours and translated;
          // the server's own sentence is added only where the shared gate lets it through (a 400/409
          // refusal), never an exception's text.
          failure(err, body) {
            const gate = App.services.apiErrors;
            let title;
            switch (err.httpStatus) {
              case 412: title = this.t('notConfigured', 'Document capture is not configured on this instance.'); break;
              case 502: title = this.t('upstream', 'The reading service could not be reached. Try again.'); break;
              case 422: title = this.t('failed', 'The document could not be read.'); break;
              default:
                // A REJECTED capture is a refusal (400): the document was read, and the server says in
                // an authored sentence why no record could be created - the gate below quotes it.
                title = body && body.status === 'REJECTED'
                  ? this.t('rejected', 'The document was read, but the record could not be created.')
                  : this.t('failedGeneric', 'The document could not be captured.');
            }
            const known = [412, 502, 422].indexOf(err.httpStatus) >= 0;
            return { variant: 'negative', title, text: known ? '' : gate.refusalMessageFor(err) };
          },

          accept(result) {
            this.uploaded = true;
            this.recordId = result.recordId;
            this.review = {
              captureName: result.captureName, fileName: result.fileName, status: result.status,
              provider: result.provider, model: result.model, capturedAt: null, capturedBy: null,
              flags: Array.isArray(result.flags) ? result.flags : [],
            };
            this.reviewState = 'ready';
            this.step = 'review';
            this.loadReview(result.recordId, true);
            this.loadFiles(result.recordId);
            this.$nextTick(() => { const main = document.getElementById('capture-main'); if (main) main.scrollTop = 0; });
          },

          // ----- the review step -----

          // The ledger's entry for the record; after an upload it only completes what the upload
          // answered (who, when), so a failed read leaves the review standing.
          async loadReview(id, seeded) {
            if (!seeded) this.reviewState = 'loading';
            try {
              const data = await App.services.api.get(this.captureBase + '/review/' + enc(id), { baseUrl: '' });
              if (data && data.captureName) {
                this.review = Object.assign({}, data, { flags: Array.isArray(data.flags) ? data.flags : [] });
                this.reviewState = 'ready';
              } else if (!seeded) {
                this.review = null;
                this.reviewState = 'none';
              }
            } catch (e) {
              if (!seeded) {
                this.reviewError = App.services.apiErrors.messageFor(e, this.t('loadError', 'The capture details could not be loaded.'));
                this.reviewState = 'error';
              }
            }
          },

          async loadFiles(id) {
            if (!this.filesBase) { this.fileState = 'none'; return; }
            this.fileState = 'loading';
            try {
              const rows = await App.services.api.get(this.filesBase + '?' + enc(this.fk) + '=' + enc(id), { baseUrl: '' });
              const list = Array.isArray(rows) ? rows : [];
              const wanted = this.review && this.review.fileName;
              const row = list.find((r) => wanted && r.FileName === wanted) || list[0];
              const key = row ? (row.Id !== undefined ? row.Id : row.id) : undefined;
              if (key === undefined || key === null) { this.fileState = 'empty'; return; }
              const name = row.FileName || '';
              const type = String(row.ContentType || '').toLowerCase();
              const pdf = type === 'application/pdf' || /\.pdf$/i.test(name);
              const image = type.indexOf('image/') === 0 || /\.(png|jpe?g|gif|webp)$/i.test(name);
              if (!pdf && !image) { this.fileState = 'error'; return; }
              this.kept = {
                id: key, name, kind: pdf ? 'pdf' : 'image',
                url: this.filesBase + '/' + enc(key) + '/download?disposition=inline',
              };
              this.fileState = 'ready';
            } catch (e) {
              this.fileState = 'error';
            }
          },

          get flags() { return this.review && Array.isArray(this.review.flags) ? this.review.flags : []; },

          get flagCountText() {
            const n = this.flags.length;
            return n === 1
              ? this.t('reviewOne', '1 thing to review')
              : this.t('reviewMany', '{{n}} things to review', { n });
          },

          get whenText() {
            const at = this.review && this.review.capturedAt;
            const date = at ? new Date(at) : null;
            return date && !isNaN(date.getTime()) ? date.toLocaleString() : '';
          },

          get liveText() {
            if (this.busy) return this.t('busy', 'Reading the document - this can take up to a minute. Keep this window open.');
            return this.step === 'review' && this.reviewState === 'ready' ? this.flagCountText : '';
          },

          // A field name as a person reads it: `items[2].price` is "Line 2 - price", `billedOn` is
          // "Billed on". A name that is not a plain identifier (an authored label) is shown as it is.
          fieldLabel(field) {
            const text = String(field === null || field === undefined ? '' : field);
            const line = /^items\[(\d+)\](?:\.(.+))?$/.exec(text);
            if (line) {
              return line[2]
                ? this.t('lineField', 'Line {{n}} - {{field}}', { n: line[1], field: this.words(line[2], false) })
                : this.t('line', 'Line {{n}}', { n: line[1] });
            }
            return this.words(text, true);
          },

          words(name, capitalize) {
            if (!SAFE_NAME.test(name)) return name;
            const parts = name.replace(/_/g, ' ').replace(/([a-z0-9])([A-Z])/g, '$1 $2').split(' ')
              .map((word) => (word.length > 1 && word === word.toUpperCase() ? word : word.toLowerCase()));
            const joined = parts.join(' ');
            return capitalize ? joined.charAt(0).toUpperCase() + joined.slice(1) : joined;
          },

          reasonLabel(reason) {
            const labels = {
              MISSING: ['MISSING', 'Not found on the document'],
              LOW_CONFIDENCE: ['LOW_CONFIDENCE', 'Read with low confidence'],
              UNREADABLE: ['UNREADABLE', 'Could not be read as a value'],
              NO_MATCH: ['NO_MATCH', 'No matching record'],
              AMBIGUOUS_MATCH: ['AMBIGUOUS_MATCH', 'Several matching records'],
              QR_MISMATCH: ['QR_MISMATCH', "Differs from the document's code"],
              MISMATCH: ['MISMATCH', 'Differs from the calculated value'],
              LINE: ['LINE', 'Line read with low confidence'],
              LINE_SKIPPED: ['LINE_SKIPPED', 'Line not created'],
              WARNING: ['WARNING', 'Warning'],
            };
            const entry = labels[reason];
            return entry ? this.t('reason.' + entry[0], entry[1]) : this.t('reason.OTHER', 'Needs a look');
          },

          reasonVariant(reason) { return reason === 'MISMATCH' || reason === 'QR_MISMATCH' ? 'negative' : 'warning'; },

          // The server's explanation, unless it only repeats the reason's own label.
          flagNote(flag) {
            const note = flag && typeof flag.message === 'string' ? flag.message.trim() : '';
            return note && note.toLowerCase() !== this.reasonLabel(flag.reason).toLowerCase() ? note : '';
          },

          // ----- leaving -----

          close(status, message) {
            const payload = { type: 'harmonia.form.close', status };
            if (message) payload.message = message;
            window.parent.postMessage(payload, window.location.origin);
          },

          cancel() { if (!this.busy) this.close('cancelled'); },

          // After an upload the host refreshes its list and toasts the outcome; opened on an existing
          // record nothing changed, so it is dismissed silently.
          done() {
            if (!this.uploaded) { this.close('cancelled'); return; }
            const file = (this.review && this.review.fileName) || (this.chosen && this.chosen.name) || '';
            this.close('ok', this.t('doneMessage', 'Captured {{file}}: {{n}} to review', { file, n: this.flags.length }));
          },
        }));
      });
    </script>
    <script defer src="/webjars/alpinejs/dist/cdn.min.js"></script>
    <script src="/webjars/codbex__harmonia/dist/harmonia.min.js"></script>
    <script src="/webjars/lucide/dist/umd/lucide.min.js"></script>
    <!-- opt-in Harmonia Lucide plugin: registers x-h-lucide; needs window.lucide (above). -->
    <script src="/webjars/codbex__harmonia/dist/harmonia-lucide.min.js"></script>
  </body>

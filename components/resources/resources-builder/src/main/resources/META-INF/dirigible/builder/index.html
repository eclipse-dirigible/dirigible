<!DOCTYPE html>
<!--
  The Builder shell - a conversational AI intent builder. You describe the application; an app.intent
  is created and evolved underneath; the canvas visualises it; one button publishes it as a running
  application. It is a pure frontend orchestration over endpoints that already ship (the intent
  engine, the workspace, the publisher, the health and problems feeds) and reuses the shared Harmonia
  runtime served from /services/web/application-core/shell for theme, notifications, branding and i18n.

  There is no router: the Builder is one screen, so Pinecone would only add indirection.
-->
<!-- data-brand-title: services/branding.js sets the tab title to the instance brand name. -->
<html lang="en" data-brand-title>

  <head>
    <meta charset="UTF-8" />
    <!-- Placeholder favicon, replaced at runtime by services/branding.js (DIRIGIBLE_BRANDING_FAVICON). -->
    <link rel="icon" sizes="any" href="data:;base64,iVBORw0KGgo=" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Builder</title>

    <link href="/webjars/codbex__harmonia/dist/harmonia.css" rel="stylesheet" />
    <link href="/services/web/application-core/shell/css/app.css" rel="stylesheet" />
    <!-- The diagram's glue cards are badged with SAP-icon glyphs, whose @font-face lives here.
         Without it they render as tofu squares - a standalone page must link it explicitly. -->
    <link href="/services/web/platform-core/ui/styles/fonts.css" rel="stylesheet" />
    <link href="./css/app.css" rel="stylesheet" />

    <script>
      (function () {
        try { if (!localStorage.getItem('codbex.harmonia.colorMode')) localStorage.setItem('codbex.harmonia.colorMode', 'light'); } catch (e) { /* no storage */ }
      })();
    </script>

    <!-- mxGraph: the canvas renders with the same engine the EDM / BPMN modelers and the Intent
         Editor use. Classic globals, so it loads before anything that draws. -->
    <script>
      mxBasePath = '/services/web/resources/mxgraph/4.2.2/src';
    </script>
    <script src="/services/web/resources/mxgraph/4.2.2/src/js/mxClient.js"></script>
  </head>

  <body class="vbox size-full" x-data="app">

    <!-- x-cloak hides the shell until Alpine + Harmonia upgrade the markup (no raw-chrome flash). -->
    <div x-cloak class="vbox size-full">

      <div x-h-toolbar data-variant="transparent">
        <img :src="$store.branding.logo" :alt="$store.branding.name" class="size-5" />
        <span x-h-toolbar-title class="shrink-0" x-text="T('builder:builder.title', 'Builder')"></span>

        <!-- App switcher: the builder apps in the workspace, plus a way to start a new one. The
             project behind an app is a technical detail the user never has to name or manage. -->
        <button id="user-menu-trigger" x-h-button x-h-menu-trigger.dropdown data-variant="transparent" data-size="sm" class="ml-2">
          <span x-text="$store.intent.appName || T('builder:builder.apps.untitled', 'New app')"></span>
          <i role="img" x-h-lucide data-lucide="chevrons-up-down"></i>
        </button>
        <ul x-h-menu aria-label="Apps" data-align="bottom-start">
          <div x-h-menu-label x-text="T('builder:builder.apps.title', 'Your apps')"></div>
          <template x-for="project in $store.intent.apps" :key="project">
            <li x-h-menu-item @click="openApp(project)">
              <i role="img" x-h-lucide data-lucide="layout-grid"></i>
              <span class="flex-1" x-text="project"></span>
              <svg x-h-lucide x-show="$store.intent.project === project" role="img" data-lucide="check"></svg>
            </li>
          </template>
          <div x-h-menu-separator></div>
          <li x-h-menu-item @click="newApp()">
            <i role="img" x-h-lucide data-lucide="plus"></i>
            <span x-text="T('builder:builder.apps.new', 'New app')"></span>
          </li>
        </ul>

        <div x-h-toolbar-spacer></div>

        <!-- Publish: the single action. Everything else on this page is conversation. -->
        <button x-h-button data-variant="primary" data-size="sm" @click="publish()"
                :disabled="!canPublish" :aria-busy="$store.publish.running">
          <!-- An <svg> placeholder, not an <i>: x-h-lucide REPLACES an <i> with the rendered svg, so
               any Alpine binding on it would be lost - the plugin throws rather than lose it, and an
               uncaught throw here aborts Alpine's walk over everything below. -->
          <svg x-h-lucide role="img" :data-lucide="$store.publish.running ? 'loader-circle' : 'rocket'"
               :class="$store.publish.running ? 'animate-spin' : ''"></svg>
          <span x-text="$store.publish.running ? $store.publish.activity : T('builder:builder.publish', 'Publish')"></span>
        </button>

        <button x-h-button data-variant="transparent" data-size="icon-sm" @click="toggleSource()"
                :title="T('builder:builder.source.view', 'View source')" aria-label="View source">
          <i role="img" x-h-lucide data-lucide="file-code-2"></i>
        </button>

        <button x-h-button data-variant="transparent" data-size="icon-sm" @click="$store.theme.toggle()"
                :aria-label="$store.theme.value === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'" title="Toggle theme">
          <svg x-h-lucide x-show="$store.theme.value !== 'dark'" role="img" data-lucide="moon"></svg>
          <svg x-h-lucide x-show="$store.theme.value === 'dark'" role="img" data-lucide="sun"></svg>
        </button>

        <!-- Notifications: the bell shows the unread count; the popover lists them. -->
        <button x-h-button x-h-popover-trigger data-variant="transparent" data-size="icon-sm" aria-label="Notifications" class="relative">
          <i role="img" x-h-lucide data-lucide="bell"></i>
          <span x-show="$store.notifications.unreadCount > 0" class="absolute" x-text="$store.notifications.unreadCount"
                style="right:-2px; bottom:-2px; min-width:15px; height:15px; padding:0 3px; border-radius:9999px; background:#e01b24; color:#fff; font-size:9px; line-height:15px; text-align:center; font-weight:700;"></span>
        </button>
        <div class="w-80" x-h-popover data-innerclicks="true">
          <div x-h-toolbar data-size="sm">
            <span x-h-toolbar-title class="shrink-0" x-text="T('application-core:shell.notifications.title', 'Notifications')"></span>
            <div x-h-toolbar-spacer></div>
            <button x-h-button data-variant="transparent" data-size="icon-sm" @click="$store.notifications.markAllRead()"
                    title="Mark all as read" aria-label="Mark all as read"><i role="img" x-h-lucide data-lucide="check-check"></i></button>
          </div>
          <div x-show="$store.notifications.items.length === 0" x-h-text.muted class="p-3 text-sm"
               x-text="T('application-core:shell.notifications.caughtUp', 'You’re all caught up.')"></div>
          <ol x-show="$store.notifications.items.length" x-h-notification-list>
            <template x-for="n in $store.notifications.items" :key="n.id">
              <li x-h-notification class="hbox" :data-unread="n.unread ? 'true' : 'false'">
                <div x-h-notification-media><svg x-h-icon data-icon="circle-info" class="size-5" role="img" aria-label="info"></svg></div>
                <div class="vbox flex-1">
                  <h1 x-h-notification-title x-text="n.title"></h1>
                  <p x-h-notification-description x-text="n.description"></p>
                </div>
              </li>
            </template>
          </ol>
        </div>

        <!-- Logged-in user: avatar; the dropdown shows the user name and Log out. -->
        <button x-h-button x-h-menu-trigger.dropdown data-variant="transparent" data-size="icon-sm"
                :aria-label="$store.currentUser.name || 'Account'">
          <i role="img" x-h-lucide data-lucide="circle-user"></i>
        </button>
        <ul x-h-menu aria-label="User menu" data-align="bottom-end">
          <div x-h-tile class="mb-1">
            <div x-h-tile-media><i role="img" x-h-lucide data-lucide="circle-user" class="size-6"></i></div>
            <div x-h-tile-content>
              <div x-h-tile-title x-text="$store.currentUser.name || T('application-core:shell.user.user', 'User')"></div>
            </div>
          </div>
          <div x-h-menu-separator></div>
          <!-- Switch shells without the detour through Home: the same `platform-shells` list the
               launchpad renders, minus this one (the shared `shells` store). -->
          <div x-h-menu-label x-text="T('application-core:shell.switch.title', 'Switch to')"></div>
          <li x-h-menu-item @click="$store.shells.openHome()">
            <i role="img" x-h-lucide data-lucide="house"></i>
            <span x-text="T('application-core:shell.switch.home', 'Home')"></span>
          </li>
          <template x-for="shell in $store.shells.items" :key="shell.id">
            <li x-h-menu-item @click="$store.shells.open(shell)">
              <!-- svg, not <i>: the Lucide plugin REPLACES the element it upgrades, so a bound
                   :data-lucide on an <i> throws and aborts Alpine's walk over the rest of the menu. -->
              <svg x-h-lucide role="img" :data-lucide="$store.shells.iconFor(shell)"></svg>
              <span x-text="shell.label"></span>
            </li>
          </template>
          <div x-h-menu-separator></div>
          <li x-h-menu-item data-variant="negative" @click="logout()">
            <i role="img" x-h-lucide data-lucide="log-out"></i> <span x-text="T('application-core:shell.user.logout', 'Log out')"></span>
          </li>
        </ul>
      </div>

      <!-- The assistant needs a server-side API key; without one this shell can do nothing, so the
           notice is persistent rather than a transient bubble. -->
      <div x-show="$store.conversation.notConfigured" x-cloak class="hbox items-center gap-2 px-3 py-1.5 text-sm"
           style="background: var(--color-warning, #b45309); color: #fff;">
        <i role="img" x-h-lucide data-lucide="triangle-alert"></i>
        <span x-text="T('builder:builder.notConfigured', 'The AI assistant is not configured on this instance. Set DIRIGIBLE_INTENT_AI_API_KEY on the server and reload this page.')"></span>
      </div>

      <div x-h-split class="flex-1 min-h-0" data-orientation="horizontal" data-variant="border">

        <!-- ---------- Conversation ---------- -->
        <div x-h-split-panel data-size="40%" data-min="320">
          <div class="vbox size-full">

            <div id="builder-messages" class="builder-messages flex-1">

              <!-- First run: say what this is and offer a way in, so the user is never facing a
                   blank prompt wondering what to type. -->
              <template x-if="!$store.conversation.messages.length">
                <div class="builder-welcome vbox gap-3">
                  <div class="vbox gap-1">
                    <span class="text-base font-medium" x-text="T('builder:builder.welcome.title', 'Describe the application you need.')"></span>
                    <span class="text-sm" x-h-text.muted
                          x-text="T('builder:builder.welcome.subtitle', 'Tell me what it should do in plain language. I will design it as we talk, and one button turns it into a running application.')"></span>
                  </div>
                  <div class="vbox gap-2">
                    <template x-for="example in examples" :key="example">
                      <button x-h-button data-variant="outline" data-size="sm" class="builder-example"
                              @click="useExample(example)" x-text="example"></button>
                    </template>
                  </div>
                </div>
              </template>

              <template x-for="(message, index) in $store.conversation.messages" :key="index">
                <div class="builder-message" :class="message.role" x-text="message.text"></div>
              </template>

              <template x-if="$store.conversation.busy">
                <div class="builder-message assistant builder-thinking hbox items-center gap-2">
                  <i role="img" x-h-lucide data-lucide="loader-circle" class="animate-spin"></i>
                  <span x-text="$store.conversation.phase"></span>
                </div>
              </template>
            </div>

            <div class="builder-composer hbox gap-2">
              <textarea id="builder-input" x-h-textarea rows="2" class="flex-1"
                        :placeholder="T('builder:builder.composer.placeholder', 'Describe a change...')"
                        x-model="$store.conversation.input" @keydown="onKey($event)"
                        :disabled="$store.conversation.busy"></textarea>
              <button x-h-button data-variant="primary" data-size="icon" @click="send()"
                      :disabled="$store.conversation.busy || !$store.conversation.input.trim()"
                      aria-label="Send" title="Send">
                <i role="img" x-h-lucide data-lucide="send-horizontal"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- ---------- Canvas ---------- -->
        <div x-h-split-panel data-size="60%" data-min="360">
          <div class="vbox size-full overflow-auto">

            <!-- Running: the pipeline's steps tick through, so a long publish shows progress
                 instead of a spinner with nothing behind it. -->
            <template x-if="$store.publish.running">
              <div class="builder-panel vbox gap-3">
                <span class="text-base font-medium" x-text="T('builder:builder.pipeline.title', 'Publishing your application')"></span>
                <ul class="vbox gap-2">
                  <template x-for="step in $store.publish.steps" :key="step.key">
                    <li class="hbox items-center gap-2 text-sm" :class="step.status === 'pending' ? 'opacity-50' : ''">
                      <svg x-h-lucide role="img" :data-lucide="stepIcon(step.status)"
                           :class="step.status === 'running' ? 'animate-spin' : ''"></svg>
                      <span x-text="step.label"></span>
                      <span x-show="step.detail" x-h-text.muted x-text="step.detail"></span>
                    </li>
                  </template>
                </ul>
              </div>
            </template>

            <!-- Success: the visible sign that the conversation became a real application, with
                 somewhere to go and try it. -->
            <template x-if="$store.publish.state === 'success'">
              <div class="builder-panel vbox gap-4">
                <div class="hbox items-center gap-3">
                  <span x-h-avatar class="rounded-full" data-variant="positive">
                    <svg x-h-icon data-icon="circle-success" role="img" aria-label="success"></svg>
                  </span>
                  <span class="text-lg font-medium">
                    <span x-text="$store.intent.appName"></span>
                    <span x-text="T('builder:builder.success.isLive', 'is live.')"></span>
                  </span>
                </div>

                <div x-show="$store.publish.warnings.length" class="builder-warnings vbox gap-1">
                  <span class="text-sm font-medium" x-text="T('builder:builder.success.warnings', 'Generated with notes:')"></span>
                  <template x-for="warning in $store.publish.warnings" :key="warning">
                    <span class="text-sm" x-text="warning"></span>
                  </template>
                </div>

                <div class="vbox gap-2">
                  <span class="text-sm" x-h-text.muted x-text="T('builder:builder.success.tryIt', 'Try it here:')"></span>
                  <div class="hbox gap-2 flex-wrap">
                    <a x-show="$store.publish.appUrl" x-h-button data-variant="primary" data-size="sm"
                       :href="$store.publish.appUrl" target="_blank" rel="noopener">
                      <i role="img" x-h-lucide data-lucide="external-link"></i>
                      <span x-text="$store.intent.appName"></span>
                    </a>
                    <template x-for="shell in $store.publish.shells" :key="shell.id">
                      <a x-h-button data-variant="outline" data-size="sm" :href="shell.path" target="_blank" rel="noopener">
                        <i role="img" x-h-lucide data-lucide="external-link"></i>
                        <span x-text="shell.label"></span>
                      </a>
                    </template>
                  </div>
                </div>

                <div class="hbox">
                  <button x-h-button data-variant="transparent" data-size="sm" @click="$store.publish.dismiss()"
                          x-text="T('builder:builder.success.keepBuilding', 'Keep building')"></button>
                </div>
              </div>
            </template>

            <!-- Failure: which step, and what the platform said. A published-with-errors run lands
                 here too - the Problems diff is the only place a failed synchronizer is visible. -->
            <template x-if="$store.publish.state === 'failure'">
              <div class="builder-panel vbox gap-4">
                <div class="hbox items-center gap-3">
                  <span x-h-avatar class="rounded-full" data-variant="negative">
                    <svg x-h-icon data-icon="circle-error" role="img" aria-label="error"></svg>
                  </span>
                  <span class="text-lg font-medium"
                        x-text="$store.publish.problems.length
                          ? T('builder:builder.failure.published', 'Published with errors')
                          : T('builder:builder.failure.title', 'Could not publish')"></span>
                </div>

                <ul class="vbox gap-2">
                  <template x-for="step in $store.publish.steps" :key="step.key">
                    <li class="hbox items-center gap-2 text-sm" :class="step.status === 'pending' ? 'opacity-50' : ''">
                      <svg x-h-lucide role="img" :data-lucide="stepIcon(step.status)"></svg>
                      <span x-text="step.label"></span>
                    </li>
                  </template>
                </ul>

                <div x-show="$store.publish.error" class="builder-issues text-sm" x-text="$store.publish.error"></div>

                <div x-show="$store.publish.issues.length" class="builder-issues vbox gap-1">
                  <span class="text-sm font-medium" x-text="T('builder:builder.failure.issues', 'The description does not hold together yet:')"></span>
                  <template x-for="issue in $store.publish.issues" :key="issue">
                    <span class="text-sm" x-text="issue"></span>
                  </template>
                </div>

                <div x-show="$store.publish.problems.length" class="builder-issues vbox gap-2">
                  <template x-for="problem in $store.publish.problems" :key="problem.id">
                    <div class="vbox gap-0">
                      <span class="text-sm font-medium" x-text="problem.location"></span>
                      <span class="text-sm" x-text="problem.cause"></span>
                      <span class="text-xs" x-h-text.muted x-text="problem.category"></span>
                    </div>
                  </template>
                </div>

                <div class="hbox gap-2">
                  <button x-h-button data-variant="primary" data-size="sm" @click="publish()"
                          x-text="T('builder:builder.failure.retry', 'Try again')"></button>
                  <button x-h-button data-variant="transparent" data-size="sm" @click="$store.publish.dismiss()"
                          x-text="T('builder:builder.failure.back', 'Back to the app')"></button>
                </div>
              </div>
            </template>

            <!-- Idle: what the app currently IS - the counts, then the diagrams. -->
            <div x-show="$store.publish.state === 'idle' && !$store.publish.running" class="vbox size-full">

              <div x-show="$store.intent.counts.length" class="builder-summary hbox gap-2 flex-wrap">
                <template x-for="count in $store.intent.counts" :key="count.key">
                  <span x-h-badge data-variant="outline">
                    <span x-text="count.value"></span>
                    <span x-text="count.label"></span>
                  </span>
                </template>
              </div>

              <div x-show="!$store.intent.hasIntent" class="builder-panel">
                <span class="text-sm" x-h-text.muted
                      x-text="T('builder:builder.canvas.empty', 'Your application will appear here as you describe it.')"></span>
              </div>

              <div id="builder-diagrams" class="builder-diagrams"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- The read-only source drawer. The intent YAML is what was built, shown on request; the Intent
         Editor in the IDE remains the place to edit it. -->
    <div x-h-dialog-overlay :data-open="sourceOpen">
      <div x-h-dialog style="width: 92vw; max-width: 900px;">
        <div x-h-dialog-header>
          <h2 x-h-dialog-title x-text="T('builder:builder.source.title', 'app.intent')"></h2>
          <button x-h-dialog-close @click="sourceOpen = false" aria-label="Close"><i role="img" x-h-lucide data-lucide="x"></i></button>
        </div>
        <div x-h-dialog-content>
          <pre class="builder-source" x-text="$store.intent.yaml || T('builder:builder.source.emptyText', 'Nothing yet.')"></pre>
        </div>
        <div x-h-dialog-footer>
          <button x-h-button data-variant="transparent" @click="copySource()"
                  x-text="copied ? T('builder:builder.source.copied', 'Copied') : T('builder:builder.source.copy', 'Copy')"></button>
          <button x-h-button data-variant="primary" @click="sourceOpen = false"
                  x-text="T('builder:builder.source.close', 'Close')"></button>
        </div>
      </div>
    </div>

    <!-- App-wide transient toasts (raised through Harmonia's notifications magic with this template). -->
    <section x-h-notification-overlay>
      <template id="toast">
        <li x-h-notification.floating data-variant="toast" class="hbox items-center gap-3 min-w-3xs max-w-md">
          <div x-h-notification-media>
            <span x-h-avatar class="rounded-full" :data-variant="variant">
              <template x-if="variant === 'positive'"><svg x-h-icon data-icon="circle-success" role="img" aria-label="success"></svg></template>
              <template x-if="variant === 'negative'"><svg x-h-icon data-icon="circle-error" role="img" aria-label="error"></svg></template>
              <template x-if="variant !== 'positive' && variant !== 'negative'"><svg x-h-icon data-icon="circle-info" role="img" aria-label="info"></svg></template>
            </span>
          </div>
          <span x-h-notification-title class="flex-1" x-text="message"></span>
          <div x-h-notification-actions data-orientation="vertical">
            <button x-h-button x-h-notification-close class="rounded-full" data-variant="transparent" data-size="icon-md" aria-label="Dismiss">
              <svg x-h-icon data-icon="close" role="img" aria-label="close"></svg>
            </button>
          </div>
        </li>
      </template>
    </section>

    <!-- 1. Shared Harmonia runtime (served from application-core) + local config (defer keeps order) -->
    <script src="/services/web/application-core/shell/js/app.js" defer></script>
    <script src="./js/config.js" defer></script>
    <script src="/services/web/application-core/shell/js/services/i18n.js" defer></script>
    <!-- Instance branding (the same DIRIGIBLE_BRANDING_* env vars as the AngularJS shell): the
         platform service sets top.PlatformBranding; the adapter applies the favicon/title and
         exposes it as the Alpine `branding` store. Load the source before the adapter. -->
    <script src="/services/js/platform-branding/branding.js" defer></script>
    <script src="/services/web/application-core/shell/js/services/branding.js" defer></script>
    <script src="/services/web/application-core/shell/js/stores/theme.js" defer></script>
    <script src="/services/web/application-core/shell/js/stores/notifications.js" defer></script>
    <script src="/services/web/application-core/shell/js/stores/currentUser.js" defer></script>
    <script src="/services/web/application-core/shell/js/stores/shells.js" defer></script>

    <!-- 2. The diagram renderer, shared with the Intent Editor (loaded by absolute URL, no copy). -->
    <script src="/services/web/editor-intent/js/intent-diagrams.js" defer></script>

    <!-- 3. The Builder itself -->
    <script src="./js/services/intentApi.js" defer></script>
    <script src="./js/stores/intent.js" defer></script>
    <script src="./js/stores/conversation.js" defer></script>
    <script src="./js/services/pipeline.js" defer></script>
    <script src="./js/appShell.js" defer></script>

    <!-- 4. Alpine LAST (the Harmonia bundle auto-starts Alpine - do NOT call Alpine.start()) -->
    <script defer src="/webjars/alpinejs/dist/cdn.min.js"></script>
    <script src="/webjars/codbex__harmonia/dist/harmonia.min.js"></script>

    <!-- 5. Lucide icons -->
    <script src="/webjars/lucide/dist/umd/lucide.min.js"></script>
    <!-- opt-in Harmonia Lucide plugin: registers x-h-lucide (renders Lucide icons + keeps them in sync). -->
    <script src="/webjars/codbex__harmonia/dist/harmonia-lucide.min.js"></script>
  </body>

</html>

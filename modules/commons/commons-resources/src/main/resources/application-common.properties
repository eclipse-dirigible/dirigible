spring.application.name=Eclipse Dirigible

server.port=${DIRIGIBLE_SERVER_PORT:8080}

# The session cookie: SameSite=Lax keeps a browser from sending it with a form another site posts
# (cross-site request forgery), HttpOnly keeps it from scripts. Tomcat marks it Secure on every request
# it sees as secure (behind a TLS-terminating proxy only with server.forward-headers-strategy);
# DIRIGIBLE_SESSION_COOKIE_SECURE=true forces it where the proxy does not forward the scheme.
server.servlet.session.cookie.same-site=${DIRIGIBLE_SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${DIRIGIBLE_SESSION_COOKIE_SECURE:false}

spring.main.allow-bean-definition-overriding=true
# Surface the reason of a ResponseStatusException in the JSON error body - without it every
# REST error reaches API callers and UIs as a bare status phrase with no actionable detail.
# Spring Boot 4.0 renamed this from server.error.include-message and deprecated the old key at
# level=error, so the old spelling is not bound at all and fails silently - keep the spring.web
# prefix.
spring.web.error.include-message=always

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.location=${java.io.tmpdir}

spring.datasource.hikari.connectionTimeout=3600000
spring.mvc.async.request-timeout=3600000

basic.enabled=${DIRIGIBLE_BASIC_ENABLED:true}

terminal.enabled=${DIRIGIBLE_TERMINAL_ENABLED:true}

java.lsp.enabled=${DIRIGIBLE_JAVA_LSP_ENABLED:true}

management.metrics.mongo.command.enabled=false
management.metrics.mongo.connectionpool.enabled=false

cxf.path=/odata/v2

management.endpoints.web.exposure.include=*
# the health components (artefacts, aot, scheduler, ...) and their numbers, to an authenticated
# caller (#7533); an anonymous probe of the public /actuator/health still reads the status alone
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/api-docs

# the following are used to force the Spring to create QUARTZ tables
# quartz properties are manged in quartz.properties don't try to add them here
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always

# enable /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true

# Show JPA SQLs
#logging.level.org.hibernate.SQL=debug

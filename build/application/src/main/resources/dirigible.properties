# Deployment overrides for this distribution, loaded after dirigible-commons.properties.
#
# The product identity is declared HERE because this module filters its resources (and runs the
# git-commit-id plugin). dirigible-commons.properties ships the same three keys, but that module
# does not filter them, so an instance built without this file reported the raw Maven placeholders -
# which is why the Workbench's About window and /services/core/version had no version to show. A
# downstream distribution overrides these with its own dirigible.properties.
DIRIGIBLE_PRODUCT_NAME=${project.title}
DIRIGIBLE_PRODUCT_VERSION=${project.version}
DIRIGIBLE_PRODUCT_COMMIT_ID=${git.commit.id}
